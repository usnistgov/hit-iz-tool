services:
  onc-tomcat:
    image:  nist775hit/hit-iz-onc-tool:latest
    platform: linux/amd64
    ports:
      - "13102:8080"
    depends_on:
      onc-mysql:
        condition: service_healthy
        restart: true
    environment:
      - JAVA_OPTS=-Xmx4096m -Xms4096m -DRELOAD_DB=true -DCACHE_AT_STARTUP=false -DIS_DEV_TOOL=false
    restart: unless-stopped
    volumes:
      - ./tool_upload/:/tool_upload
      - ./logs/:/usr/local/tomcat/logs
    links:
      - onc-mysql:container-mysql

  onc-mysql:
    image: nist775hit/hit-iz-onc-mysql:latest
    platform: linux/amd64
    ports:
      - "3318:3306"
    environment:
    - MYSQL_ROOT_PASSWORD=root_password
    restart: unless-stopped
    volumes:
      - ./db_data:/var/lib/mysql
      - ./db_config/my-custom.cnf:/etc/mysql/conf.d/my-custom.cnf:ro
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s


